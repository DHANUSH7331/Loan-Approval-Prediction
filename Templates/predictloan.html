<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Approval Prediction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>Loan Approval Form</h2>
    <form action="predict.php" method="post">

      <div class="form-group">
        <label for="annual_income">Annual Income:</label>
        <input type="number" name="annual_income" id="annual_income" required>
      </div>

      <div class="form-group">
        <label for="loan_amount">Loan Amount:</label>
        <input type="number" name="loan_amount" id="loan_amount" required>
      </div>

      <div class="form-group">
        <label for="credit_score">Credit Score:</label>
        <input type="number" name="credit_score" id="credit_score" required>
      </div>

      <div class="form-group">
        <label for="employment_type">Employment Type:</label>
        <select name="employment_type" id="employment_type" required>
          <option value="Salaried">Salaried</option>
          <option value="Self-Employed">Self-Employed</option>
        </select>
      </div>

      <div class="form-group">
        <label for="loan_term">Loan Term (in years):</label>
        <input type="number" name="loan_term" id="loan_term" required>
      </div>

      <div class="form-group">
        <label for="existing_loans">Existing Loans:</label>
        <select name="existing_loans" id="existing_loans" required>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>

      <div class="form-group">
        <label for="model_choice">Choose Model:</label>
        <select name="model_choice" id="model_choice" required>
          <option value="logistic">Logistic Regression</option>
          <option value="random_forest">Random Forest</option>
          <option value="xgboost">XGBoost</option>
        </select>
      </div>

      <input type="submit" value="Predict">
    </form>
  </div>
</body>
</html>
